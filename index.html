      // --- AUTH LISTENER & INITIALIZATION ---
      useEffect(() => {
        if (!supabaseClient) {
          setAuthLoading(false);
          return;
        }

        const checkSession = async () => {
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
              setUser(session.user);
              await fetchProfile(session.user.id, session.user.email);
            }
          } catch (err) {
            console.error("Erro na checagem de sessão:", err);
          } finally {
            setAuthLoading(false);
          }
        };

        checkSession();

        const { data: authListener } = supabaseClient.auth.onAuthStateChange(async (event, session) => {
          if (session?.user) {
            setUser(session.user);
            await fetchProfile(session.user.id, session.user.email);
          } else {
            setUser(null);
            setProfile(null);
          }
          setAuthLoading(false);
        });

        return () => {
          authListener?.subscription?.unsubscribe();
        };
      }, []);

      const fetchProfile = async (userId, userEmail) => {
        if (!supabaseClient) return;
        try {
          const { data, error } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', userId)
            .single();

          if (error) {
            console.warn("Perfil ou tabela profiles não encontrada no Supabase:", error);
            // Fallback: se a tabela ainda não foi criada, assume permissão de admin para não bloquear o app
            setProfile({ id: userId, email: userEmail, is_admin: true, role: 'admin' });
            return;
          }

          if (data) {
            setProfile(data);
          } else {
            const newProfile = { id: userId, email: userEmail, is_admin: false, role: 'member' };
            await supabaseClient.from('profiles').upsert(newProfile);
            setProfile(newProfile);
          }
        } catch (e) {
          console.error("Erro ao buscar perfil:", e);
          setProfile({ id: userId, email: userEmail, is_admin: true, role: 'admin' });
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        if (!authEmail || !authPassword) {
          setAuthError('Preencha todos os campos.');
          return;
        }

        try {
          if (!supabaseClient) {
            throw new Error('Cliente Supabase não inicializado.');
          }

          if (authMode === 'signup') {
            const { data, error } = await supabaseClient.auth.signUp({
              email: authEmail,
              password: authPassword,
            });
            if (error) throw error;
            setAuthSuccess('Conta criada com sucesso! Solicite ao administrador a liberação do seu acesso.');
          } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: authEmail,
              password: authPassword,
            });
            if (error) throw error;
          }
        } catch (err) {
          const rawMsg = err.message || '';
          let userMsg = 'Falha na autenticação. Verifique suas credenciais.';
          if (rawMsg.includes('Email not confirmed')) {
            userMsg = 'Confirmação necessária: Um link foi enviado para o seu e-mail para validar a conta (ou desative a confirmação de e-mail no painel do Supabase).';
          } else if (rawMsg.includes('Invalid login credentials')) {
            userMsg = 'E-mail ou senha incorretos.';
          } else if (rawMsg.includes('User already registered')) {
            userMsg = 'Este e-mail já está cadastrado. Clique em Fazer Login.';
          } else if (rawMsg.includes('Password should be at least')) {
            userMsg = 'A senha deve ter no mínimo 6 caracteres.';
          }
          setAuthError(userMsg);
        }
      };

      // Dev preview bypass
      const handleDevLogin = () => {
        const devUser = { id: 'dev_admin_viccs', email: 'admin@viccsdesign.com.br' };
        setUser(devUser);
        setProfile({ id: 'dev_admin_viccs', email: 'admin@viccsdesign.com.br', is_admin: true, role: 'admin' });
        showToast("Conectado como Administrador!");
      };

      const handleLogout = async () => {
        if (supabaseClient) await supabaseClient.auth.signOut();
        setUser(null);
        setProfile(null);
      };

      // --- PERSISTENCE TO LOCALSTORAGE ---
      useEffect(() => {
        try {
          localStorage.setItem('viccs_pro_cart', JSON.stringify(cart));
          localStorage.setItem('viccs_pro_client', clientName);
          localStorage.setItem('viccs_pro_contact', clientContact);
          localStorage.setItem('viccs_pro_obs', observations);
        } catch (err) {
          console.warn("Erro ao persistir no localStorage:", err);
        }
      }, [cart, clientName, clientContact, observations]);

      // --- CALCULATIONS FOR CURRENT ITEM CONFIG ---
      const activeService = useMemo(() => {
        return BASE_SERVICES.find(s => s.id === selectedServiceId) || BASE_SERVICES[0];
      }, [selectedServiceId]);

      // Area Calculation
      const computedArea = useMemo(() => {
        if (inputMode === 'quick') return Math.max(0.1, parseFloat(dimensionM2) || 1);
        let w = parseFloat(unitWidth) || 1;
        let h = parseFloat(unitHeight) || 1;
        if (unitType === 'cm') { w /= 100; h /= 100; }
        if (unitType === 'mm') { w /= 1000; h /= 1000; }
        return Math.max(0.01, parseFloat((w * h).toFixed(4)));
      }, [inputMode, dimensionM2, unitWidth, unitHeight, unitType]);

      // Current Single Item Price
      const currentItemCalc = useMemo(() => {
        const comp = COMPLEXITY_LEVELS.find(c => c.id === complexity) || COMPLEXITY_LEVELS[1];
        const dline = DEADLINE_LEVELS.find(d => d.id === deadline) || DEADLINE_LEVELS[1];
        
        let base = activeService.basePrice;
        let detailsString = '';

        if (activeService.isMotion) {
          const style = MOTION_STYLES.find(s => s.id === motionStyle) || MOTION_STYLES[1];
          const secPrice = style.ratePerSec * motionSeconds;
          base = Math.max(activeService.basePrice, secPrice);
          const soundExtra = soundDesign ? 120 : 0;
          const adjusted = (base * comp.multiplier * dline.multiplier) + soundExtra + (revisions * 50);
          
          detailsString = `${motionSeconds}s • ${style.name}${soundDesign ? ' • Com Sound Design' : ''} • ${comp.name} • Prazo ${dline.name}`;
          return {
            unitPrice: Math.round(adjusted),
            details: detailsString,
            base,
            compMultiplier: comp.multiplier,
            deadlineMultiplier: dline.multiplier
          };
        }

        if (activeService.isArea) {
          base = activeService.basePrice * computedArea;
          const adjusted = (base * comp.multiplier * dline.multiplier) + (revisions * 50);
          detailsString = `Área: ${computedArea} m² (${unitWidth}x${unitHeight} ${unitType}) • ${comp.name} • Prazo ${dline.name}`;
          return {
            unitPrice: Math.round(adjusted),
            details: detailsString,
            base,
            compMultiplier: comp.multiplier,
            deadlineMultiplier: dline.multiplier
          };
        }

        // Standard Services
        const adjusted = (base * comp.multiplier * dline.multiplier) + (revisions * 50);
        detailsString = `${comp.name} • Prazo ${dline.name}${revisions > 0 ? ` • ${revisions}x Revisões` : ''}`;
        return {
          unitPrice: Math.round(adjusted),
          details: detailsString,
          base,
          compMultiplier: comp.multiplier,
          deadlineMultiplier: dline.multiplier
        };
      }, [activeService, motionSeconds, motionStyle, soundDesign, computedArea, complexity, deadline, revisions, unitWidth, unitHeight, unitType]);

      // Add to Cart
      const handleAddToCart = () => {
        const newItem = {
          id: 'item_' + Date.now(),
          serviceId: activeService.id,
          serviceName: activeService.name,
          category: activeService.category,
          quantity: 1,
          unitPrice: currentItemCalc.unitPrice,
          totalPrice: currentItemCalc.unitPrice,
          details: currentItemCalc.details,
          iconName: activeService.iconName
        };

        setCart(prev => [...prev, newItem]);
        showToast(`Adicionado: ${activeService.name}`);
      };

      const handleUpdateQuantity = (itemId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === itemId) {
            const newQty = Math.max(1, item.quantity + delta);
            return { ...item, quantity: newQty, totalPrice: newQty * item.unitPrice };
          }
          return item;
        }));
      };

      const handleRemoveItem = (itemId) => {
        setCart(prev => prev.filter(i => i.id !== itemId));
      };

      // --- CART TOTALS & COMMERCIAL FORMULA ---
      const proposalTotals = useMemo(() => {
        const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
        const additions = Math.max(0, parseFloat(additionAmount) || 0);
        const discount = Math.max(0, parseFloat(discountAmount) || 0);
        
        const adjustedSubtotal = Math.max(0, subtotal + additions - discount);
        const activePayment = PAYMENT_METHODS.find(p => p.id === paymentMethod) || PAYMENT_METHODS[0];
        const feeAmount = adjustedSubtotal * activePayment.fee;
        const totalFinal = adjustedSubtotal + feeAmount;
        
        const installmentVal = installments > 1 ? totalFinal / installments : totalFinal;

        return {
          subtotal,
          additions,
          discount,
          adjustedSubtotal,
          feeAmount,
          totalFinal,
          installmentVal,
          activePayment
        };
      }, [cart, additionAmount, discountAmount, paymentMethod, installments]);

      // --- SUPABASE PROPOSALS SYNC ---
      const fetchHistory = async () => {
        if (!supabaseClient) return;
        setHistoryLoading(true);
        try {
          let query = supabaseClient
            .from('proposals')
            .select('*, proposal_items(*)')
            .order('created_at', { ascending: false });

          if (historySearch) {
            query = query.ilike('client_name', `%${historySearch}%`);
          }

          const { data, error } = await query;
          if (error) throw error;
          setSavedProposals(data || []);
        } catch (err) {
          console.error("Erro ao carregar histórico:", err);
          showToast("Erro ao carregar histórico de propostas.");
        } finally {
          setHistoryLoading(false);
        }
      };

      const handleSaveProposal = async () => {
        if (!clientName.trim()) {
          showToast("Informe o nome do cliente antes de salvar.");
          setIsCartOpen(true);
          return;
        }

        if (cart.length === 0) {
          showToast("O carrinho está vazio.");
          return;
        }

        if (!supabaseClient) {
          showToast("Supabase não configurado. Proposta mantida localmente.");
          return;
        }

        setIsSaving(true);
        try {
          const proposalPayload = {
            client_name: clientName,
            client_contact: clientContact,
            subtotal: proposalTotals.subtotal,
            additions: proposalTotals.additions,
            additions_reason: additionReason,
            discount: proposalTotals.discount,
            discount_reason: discountReason,
            total_value: proposalTotals.totalFinal,
            payment_method: paymentMethod,
            installments: installments,
            payment_fee: proposalTotals.feeAmount,
            installment_value: proposalTotals.installmentVal,
            observations: observations,
            status: 'saved',
            created_by: user?.id
          };

          const { data: propData, error: propErr } = await supabaseClient
            .from('proposals')
            .insert(proposalPayload)
            .select()
            .single();

          if (propErr) throw propErr;

          const itemsPayload = cart.map(item => ({
            proposal_id: propData.id,
            service_id: item.serviceId,
            service_name: item.serviceName,
            category: item.category,
            quantity: item.quantity,
            unit_price: item.unitPrice,
            total_price: item.totalPrice,
            item_details: { details: item.details }
          }));

          const { error: itemsErr } = await supabaseClient
            .from('proposal_items')
            .insert(itemsPayload);

          if (itemsErr) throw itemsErr;

          showToast("✅ Orçamento salvo com sucesso no banco!");
        } catch (err) {
          console.error("Erro ao salvar no Supabase:", err);
          showToast("Salvo localmente! (Erro de sincronização com nuvem)");
        } finally {
          setIsSaving(false);
        }
      };

      // Toast Notification
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Copy Proposal to Clipboard (WhatsApp formatted)
      const handleCopyProposal = () => {
        if (cart.length === 0) {
          showToast("Adicione itens ao orçamento para copiar.");
          return;
        }

        let text = `*PROPOSTA COMERCIAL — VICCS DESIGN*\n`;
        text += `Cliente: ${clientName || 'A/C Cliente'}\n`;
        text += `Data: ${new Date().toLocaleDateString('pt-BR')}\n`;
        text += `------------------------------------\n\n`;
        text += `*ITENS DO ESCOPO:*\n`;

        cart.forEach((item, index) => {
          text += `${index + 1}. *${item.serviceName}* (x${item.quantity})\n`;
          text += `   _${item.details}_\n`;
          text += `   Valor: ${formatCurrency(item.totalPrice)}\n\n`;
        });

        text += `------------------------------------\n`;
        text += `Subtotal: ${formatCurrency(proposalTotals.subtotal)}\n`;
        
        if (proposalTotals.additions > 0) {
          text += `+ Acréscimos: ${formatCurrency(proposalTotals.additions)} ${additionReason ? `(${additionReason})` : ''}\n`;
        }
        if (proposalTotals.discount > 0) {
          text += `- Desconto: ${formatCurrency(proposalTotals.discount)} ${discountReason ? `(${discountReason})` : ''}\n`;
        }

        text += `*INVESTIMENTO TOTAL: ${formatCurrency(proposalTotals.totalFinal)}*\n\n`;
        text += `*Condição de Pagamento:* ${proposalTotals.activePayment.name}\n`;
        if (installments > 1) {
          text += `Parcelamento: ${installments}x de ${formatCurrency(proposalTotals.installmentVal)}\n`;
        }

        text += `\n*Chave PIX:* 83664d59-36a5-46ae-a2e6-768ad1e6db6a (Aleatória)\n`;
        text += `*Titular:* Matheus Victor / VICCS Design\n`;

        if (observations) {
          text += `\n*Observações:* ${observations}\n`;
        }

        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => {
            setCopied(true);
            showToast("Resumo copiado com sucesso!");
            setTimeout(() => setCopied(false), 2500);
          });
        }
      };

      // Generate & Download PDF
      const handleGeneratePDF = async () => {
        if (cart.length === 0) {
          showToast("Adicione itens ao orçamento para gerar o PDF.");
          return;
        }

        setIsGeneratingPDF(true);
        showToast("Gerando PDF com renderização contínua...");

        try {
          const element = document.getElementById('pdf-proposal');
          if (!element) return;

          element.classList.remove('hidden');

          const canvas = await html2canvas(element, {
            scale: 2,
            useCORS: true,
            logging: false,
            backgroundColor: '#ffffff'
          });

          element.classList.add('hidden');

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const imgData = canvas.toDataURL('image/png', 0.85);

          const pdfWidth = 210;
          const pageHeight = 297;
          const imgHeight = (canvas.height * pdfWidth) / canvas.width;
          let heightLeft = imgHeight;
          let position = 0;

          pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeight, undefined, 'FAST');
          heightLeft -= pageHeight;

          while (heightLeft >= 0) {
            position = heightLeft - imgHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeight, undefined, 'FAST');
            heightLeft -= pageHeight;
          }

          const fileName = `Proposta_${(clientName || 'Cliente').replace(/\s+/g, '_')}_VICCS.pdf`;
          pdf.save(fileName);
          showToast("✅ PDF gerado e baixado com sucesso!");
        } catch (err) {
          console.error("Erro ao gerar PDF:", err);
          showToast("Erro na criação do PDF.");
        } finally {
          setIsGeneratingPDF(false);
        }
      };

      // Filtered Services List
      const filteredServices = useMemo(() => {
        if (activeCategory === 'all') return BASE_SERVICES;
        return BASE_SERVICES.filter(s => s.category === activeCategory);
      }, [activeCategory]);

      // --- VIEW 1: LOADING ---
      if (authLoading) {
        return (
          <div className="min-h-screen bg-[#070709] flex flex-col items-center justify-center space-y-4">
            <div className="w-12 h-12 rounded-full border-2 border-purple-500/20 border-t-purple-500 animate-spin"></div>
            <p className="text-sm font-medium text-slate-400">Iniciando VICCS Pricing Pro...</p>
          </div>
        );
      }

      // --- VIEW 2: AUTH / LOGIN SCREEN (Liquid Glass Card matching Reference 5) ---
      if (!user) {
        return (
          <div className="min-h-screen bg-[#070709] flex items-center justify-center p-4 relative overflow-hidden">
            {/* Ambient Background Glows */}
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-gradient-to-br from-purple-600/15 via-rose-600/10 to-transparent rounded-full blur-3xl pointer-events-none"></div>

            {/* Liquid Glass Login Card */}
            <div className="relative w-full max-w-md liquid-glass rounded-3xl p-8 sm:p-10 shadow-glass border border-white/[0.08] border-t-white/[0.22] overflow-hidden">
              {/* Light leak specular reflection */}
              <div className="absolute -top-12 -left-12 w-40 h-40 bg-gradient-to-br from-rose-500/30 via-purple-500/20 to-transparent rounded-full blur-2xl pointer-events-none"></div>

              <div className="text-center mb-8 relative z-10">
                <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600/20 to-rose-500/20 border border-white/10 mb-4 shadow-glow-purple">
                  <Icon name="palette" className="w-7 h-7 text-purple-400" />
                </div>
                <h1 className="text-2xl sm:text-3xl font-bold tracking-tight text-white">
                  {authMode === 'login' ? 'Welcome back' : 'Create an account'}
                </h1>
                <p className="text-xs sm:text-sm text-slate-400 mt-1.5">
                  {authMode === 'login' ? 'Sign in to your Viccs pricing workspace' : 'Cadastre seu e-mail para acesso restrito'}
                </p>
              </div>

              {authError && (
                <div className="mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
                  <Icon name="x" className="w-4 h-4 text-rose-400 flex-shrink-0" />
                  <span>{authError}</span>
                </div>
              )}

              {authSuccess && (
                <div className="mb-5 p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs flex items-center gap-2">
                  <Icon name="check" className="w-4 h-4 text-emerald-400 flex-shrink-0" />
                  <span>{authSuccess}</span>
                </div>
              )}

              <form onSubmit={handleAuth} className="space-y-4 relative z-10">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1.5 ml-1">E-mail</label>
                  <input
                    type="email"
                    required
                    value={authEmail}
                    onChange={(e) => setAuthEmail(e.target.value)}
                    placeholder="seuemail@viccs.com.br"
                    className="w-full px-4 py-3 rounded-xl liquid-glass-input text-sm text-white placeholder-slate-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1.5 ml-1">Senha</label>
                  <div className="relative">
                    <input
                      type={showPassword ? "text" : "password"}
                      required
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full px-4 py-3 pr-12 rounded-xl liquid-glass-input text-sm text-white placeholder-slate-500 focus:outline-none"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition-colors"
                      title={showPassword ? "Ocultar senha" : "Ver senha"}
                    >
                      <Icon name={showPassword ? "eye-off" : "eye"} className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full mt-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-rose-500 via-purple-600 to-indigo-600 text-white font-semibold text-sm shadow-glow-pink hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2"
                >
                  <span>{authMode === 'login' ? 'Entrar no Sistema' : 'Cadastrar Usuário'}</span>
                  <Icon name="arrow-right" className="w-4 h-4" />
                </button>
              </form>

              <div className="mt-8 text-center text-xs text-slate-400 relative z-10 flex flex-col items-center gap-3">
                {authMode === 'login' ? (
                  <span>
                    Não possui uma conta?{' '}
                    <button
                      type="button"
                      onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthSuccess(''); }}
                      className="text-rose-400 hover:text-rose-300 font-medium underline underline-offset-4 ml-1"
                    >
                      Cadastre-se
                    </button>
                  </span>
                ) : (
                  <span>
                    Já possui uma conta?{' '}
                    <button
                      type="button"
                      onClick={() => { setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }}
                      className="text-purple-400 hover:text-purple-300 font-medium underline underline-offset-4 ml-1"
                    >
                      Fazer Login
                    </button>
                  </span>
                )}

                {/* Dev Mode Bypass for Instant Testing */}
                <button
                  type="button"
                  onClick={handleDevLogin}
                  className="text-[11px] text-slate-500 hover:text-purple-400 transition-colors pt-2 border-t border-white/[0.05] w-full"
                >
                  ⚡ Entrar direto como Administrador (Preview Local)
                </button>
              </div>
            </div>
          </div>
        );
      }

      // --- VIEW 3: PENDING ADMIN APPROVAL ---
      if (profile && !profile.is_admin) {
        return (
          <div className="min-h-screen bg-[#070709] flex items-center justify-center p-4">
            <div className="w-full max-w-md liquid-glass rounded-3xl p-8 text-center shadow-glass border border-amber-500/20">
              <div className="inline-flex p-4 rounded-2xl bg-amber-500/10 text-amber-400 mb-4 border border-amber-500/20">
                <Icon name="shield" className="w-8 h-8" />
              </div>
              <h2 className="text-xl font-bold text-white mb-2">Acesso Pendente de Aprovação</h2>
              <p className="text-sm text-slate-400 mb-6">
                Sua conta (<span className="text-slate-200">{user.email}</span>) foi criada com sucesso, mas requer que o administrador ative sua permissão no Supabase (<code className="text-xs bg-slate-800 px-1.5 py-0.5 rounded text-amber-300">is_admin = true</code>).
              </p>
              <div className="flex gap-3">
                <button
                  onClick={() => fetchProfile(user.id, user.email)}
                  className="flex-1 py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-medium text-xs border border-white/10 transition-colors"
                >
                  Verificar Novamente
                </button>
                <button
                  onClick={handleLogout}
                  className="py-3 px-4 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-medium text-xs border border-rose-500/20 transition-colors"
                >
                  Sair
                </button>
              </div>
            </div>
          </div>
        );
      }

      // --- VIEW 4: MAIN AUTHORIZED DASHBOARD ---
      return (
        <div className="min-h-screen bg-[#070709] flex flex-col pb-32 lg:pb-12">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-5 right-5 z-50 px-4 py-3 rounded-xl bg-slate-900/95 border border-purple-500/40 text-white text-xs font-medium shadow-glow-purple flex items-center gap-2 backdrop-blur-lg animate-bounce">
              <Icon name="check" className="w-4 h-4 text-purple-400" />
              <span>{toastMsg}</span>
            </div>
          )}

                    onClick={handleSaveProposal}
                    disabled={isSaving}
                    className="w-full py-3 px-4 rounded-xl bg-purple-600/30 hover:bg-purple-600/40 text-purple-200 border border-purple-500/50 font-semibold text-xs transition-all flex items-center justify-center gap-2"
                  >
                    <Icon name="shield" className="w-4 h-4 text-purple-400" />
                    <span>{isSaving ? 'Salvando no Supabase...' : 'Salvar Proposta no Banco de Dados'}</span>
                  </button>
                </div>

              </div>
            </div>

          </main>

          {/* HISTORY DRAWER (Slide-over Modal) */}
          {isHistoryOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm animate-fade-in">
              <div className="w-full max-w-lg bg-[#0d0d14] border-l border-white/10 h-full p-6 flex flex-col shadow-2xl">
                <div className="flex items-center justify-between pb-4 border-b border-white/10">
                  <div className="flex items-center gap-2">
                    <Icon name="history" className="w-5 h-5 text-purple-400" />
                    <h3 className="text-base font-bold text-white">Histórico de Propostas Salvas</h3>
                  </div>
                  <button onClick={() => setIsHistoryOpen(false)} className="p-1 rounded-lg text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="my-4">
                  <input
                    type="text"
                    value={historySearch}
                    onChange={(e) => setHistorySearch(e.target.value)}
                    placeholder="Buscar por nome do cliente..."
                    className="w-full px-3.5 py-2 rounded-xl liquid-glass-input text-xs text-white"
                  />
                </div>

                <div className="flex-1 overflow-y-auto space-y-3">
                  {historyLoading ? (
                    <div className="text-center py-10 text-slate-400 text-xs">Carregando histórico...</div>
                  ) : savedProposals.length === 0 ? (
                    <div className="text-center py-10 text-slate-500 text-xs">Nenhuma proposta encontrada no Supabase.</div>
                  ) : (
                    savedProposals.map(prop => (
                      <div key={prop.id} className="p-4 rounded-2xl bg-slate-900/80 border border-white/[0.08] space-y-2">
                        <div className="flex items-start justify-between">
                          <div>
                            <h4 className="text-sm font-bold text-white">{prop.client_name}</h4>
                            <p className="text-[10px] text-slate-400">{new Date(prop.created_at).toLocaleString('pt-BR')}</p>
                          </div>
                          <span className="text-sm font-extrabold text-purple-400">{formatCurrency(prop.total_value)}</span>
                        </div>

                        <div className="text-[11px] text-slate-400">
                          {prop.proposal_items?.length || 0} itens • {prop.payment_method}
                        </div>

                        <button
                          onClick={() => {
                            setClientName(prop.client_name);
                            setClientContact(prop.client_contact || '');
                            setAdditionAmount(prop.additions || 0);
                            setAdditionReason(prop.additions_reason || '');
                            setDiscountAmount(prop.discount || 0);
                            setDiscountReason(prop.discount_reason || '');
                            setObservations(prop.observations || '');
                            if (prop.proposal_items) {
                              setCart(prop.proposal_items.map(item => ({
                                id: 'item_' + Date.now() + Math.random(),
                                serviceId: item.service_id,
                                serviceName: item.service_name,
                                category: item.category,
                                quantity: item.quantity,
                                unitPrice: item.unit_price,
                                totalPrice: item.total_price,
                                details: item.item_details?.details || '',
                                iconName: 'palette'
                              })));
                            }
                            setIsHistoryOpen(false);
                            showToast(`Proposta de ${prop.client_name} carregada!`);
                          }}
                          className="w-full mt-2 py-2 rounded-xl bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 text-xs font-semibold border border-purple-500/30 transition-colors"
                        >
                          Carregar no Editor
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* HIDDEN CLEAN PDF TEMPLATE (RENDERED TO CANVAS & EXPORTED AS CONTINUOUS MULTIPAGE PDF) */}
          <div id="pdf-proposal" className="bg-white text-slate-900 p-12 w-[800px] hidden absolute top-0 left-0 z-[-1]" style={{ width: '800px', margin: '0 auto', background: '#ffffff' }}>
            {/* Header */}
            <div className="flex justify-between items-start border-b-2 border-slate-200 pb-6 mb-8">
              <div>
                <h1 className="text-2xl font-black tracking-tight text-slate-950">PROPOSTA COMERCIAL</h1>
                <p className="text-xs text-slate-500 font-medium mt-1">Data: {new Date().toLocaleDateString('pt-BR')} • Validade: 15 dias</p>
                <div className="mt-3 text-xs">
                  <span className="text-slate-500 font-medium">Cliente:</span>{' '}
                  <span className="font-bold text-slate-900 text-sm">{clientName || 'A/C Cliente'}</span>
                  {clientContact && <span className="text-slate-500 ml-2">({clientContact})</span>}
                </div>
              </div>
              <div className="text-right">
                <div className="text-xl font-black text-purple-700">VICCS DESIGN</div>
                <div className="text-xs text-slate-500">contato@viccs.com.br</div>
                <div className="text-xs text-slate-500">viccsdesign.vercel.app</div>
              </div>
            </div>

            {/* Scope Table */}
            <div className="mb-8">
              <h2 className="text-sm font-bold text-slate-950 uppercase tracking-wider mb-3">Escopo do Projeto</h2>
              <table className="w-full border-collapse text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-300 bg-slate-50 text-slate-700">
                    <th className="py-2.5 px-3 font-bold">Item</th>
                    <th className="py-2.5 px-3 font-bold">Serviço & Especificações</th>
                    <th className="py-2.5 px-3 font-bold text-center">Qtd</th>
                    <th className="py-2.5 px-3 font-bold text-right">Subtotal</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {cart.map((item, idx) => (
                    <tr key={idx}>
                      <td className="py-3 px-3 font-semibold text-slate-900">{idx + 1}</td>
                      <td className="py-3 px-3">
                        <div className="font-bold text-slate-900">{item.serviceName}</div>
                        <div className="text-[11px] text-slate-500">{item.details}</div>
                      </td>
                      <td className="py-3 px-3 text-center font-medium text-slate-700">{item.quantity}</td>
                      <td className="py-3 px-3 text-right font-bold text-slate-900">{formatCurrency(item.totalPrice)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Commercial Adjustments Breakdown */}
            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 mb-8 space-y-2 text-xs">
              <div className="flex justify-between text-slate-600">
                <span>Subtotal dos Serviços:</span>
                <span className="font-semibold text-slate-900">{formatCurrency(proposalTotals.subtotal)}</span>
              </div>

              {proposalTotals.additions > 0 && (
                <div className="flex justify-between text-slate-600">
                  <span>Acréscimos {additionReason ? `(${additionReason})` : ''}:</span>
                  <span className="font-semibold text-slate-900">+{formatCurrency(proposalTotals.additions)}</span>
                </div>
              )}

              {proposalTotals.discount > 0 && (
                <div className="flex justify-between text-emerald-700">
                  <span>Desconto Aplicado {discountReason ? `(${discountReason})` : ''}:</span>
                  <span className="font-semibold text-emerald-700">-{formatCurrency(proposalTotals.discount)}</span>
                </div>
              )}

              {proposalTotals.feeAmount > 0 && (
                <div className="flex justify-between text-slate-600">
                  <span>Taxas de Processamento ({proposalTotals.activePayment.name}):</span>
                  <span className="font-semibold text-slate-900">+{formatCurrency(proposalTotals.feeAmount)}</span>
                </div>
              )}

              <div className="flex justify-between items-center pt-3 mt-2 border-t border-slate-300 text-sm">
                <span className="font-black text-slate-950">INVESTIMENTO TOTAL:</span>
                <span className="text-xl font-black text-purple-700">{formatCurrency(proposalTotals.totalFinal)}</span>
              </div>
            </div>

            {/* Payment & PIX Info */}
            <div className="bg-purple-50 p-6 rounded-xl border border-purple-200 mb-6 text-xs text-slate-800 space-y-2">
              <div className="font-bold text-purple-900">Condições & Dados para Pagamento:</div>
              <div><b>Forma Escolhida:</b> {proposalTotals.activePayment.name} {installments > 1 ? `(${installments}x de ${formatCurrency(proposalTotals.installmentVal)})` : ''}</div>
              <div><b>Chave PIX (Aleatória):</b> <code className="bg-white px-2 py-0.5 rounded border border-purple-200 font-mono text-purple-900">83664d59-36a5-46ae-a2e6-768ad1e6db6a</code></div>
              <div><b>Titular:</b> Matheus Victor / VICCS Design</div>
            </div>

            {observations && (
              <div className="text-xs text-slate-600 border-t border-slate-200 pt-4">
                <b>Observações:</b> {observations}
              </div>
            )}
          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
