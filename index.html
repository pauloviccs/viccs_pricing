<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VICCS Pricing</title>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href=".agent/media/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href=".agent/media/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href=".agent/media/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href=".agent/media/favicon/apple-touch-icon.png">
  <link rel="manifest" href=".agent/media/favicon/site.webmanifest">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- html2canvas & jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel (Para transpilar o JSX no navegador) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-200 antialiased selection:bg-purple-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const BASE_SERVICES = [
      { id: 'id_visual', name: 'Identidade Visual Completa', basePrice: 650, category: 'design', icon: '🎨' },
      { id: 'logo', name: 'Logotipo (Individual)', basePrice: 200, category: 'design', icon: '✨' },
      { id: 'post_single', name: 'Post Instagram (Avulso)', basePrice: 50, category: 'social', icon: '📱' },
      { id: 'pack_basic', name: 'Pacote Mensal Básico', desc: 'Até 10 posts', basePrice: 450, category: 'mensal', icon: '📦' },
      { id: 'pack_inter', name: 'Pacote Mensal Intermediário', desc: '15 posts + 2 motions', basePrice: 700, category: 'mensal', icon: '🚀' },
      { id: 'pack_adv', name: 'Pacote Mensal Avançado', desc: '20+ posts, motions, menus, etc.', basePrice: 1000, category: 'mensal', icon: '💎' },
      { id: 'stamp_art', name: 'Arte para Estampa (Avulso)', basePrice: 80, category: 'print', icon: '👕' },
      { id: 'stamp_pack', name: 'Pacote Estampas (5 artes)', desc: '5 artes para coleção', basePrice: 350, category: 'print', icon: '👕' },
      { id: 'banner_m2', name: 'Banner / Lona (por m²)', desc: 'Preço por m²', basePrice: 120, category: 'impressao', icon: '🖼️' },
      { id: 'faixa_m', name: 'Faixa (por metro linear)', desc: 'Preço por metro', basePrice: 90, category: 'impressao', icon: '📐' },
      { id: 'impressao_plotagem', category: 'impressao', name: 'Plotagem', desc: 'Plotagem sob medida', basePrice: 100, icon: '🖨️' },
      { id: 'menu_manut5', name: 'Manutenção Menu Board', desc: 'Até 5 alterações', basePrice: 80, category: 'manutencao', icon: '🍽️' },
      { id: 'menu_manut15', name: 'Manutenção Menu Board', desc: 'Até 15 alterações', basePrice: 150, category: 'manutencao', icon: '🍽️' },
      { id: 'menu_redesign', name: 'Redesign Parcial Menu Board', basePrice: 250, category: 'manutencao', icon: '🔄' },
      { id: 'post_update', name: 'Atualização de Post Existente', desc: 'Data, info ou texto', basePrice: 30, category: 'manutencao', icon: '✏️' },
      { id: 'format_adapt', name: 'Adaptação de Formato', desc: 'Peça existente → outro formato', basePrice: 40, category: 'manutencao', icon: '🔀' },
    ];

    const COMPLEXITY_LEVELS = [
      { id: 'simples', name: 'Simples', multiplier: 0.9, desc: 'Layouts básicos, poucas variações' },
      { id: 'normal', name: 'Normal', multiplier: 1.0, desc: 'Padrão do portfólio' },
      { id: 'complexo', name: 'Complexo', multiplier: 1.3, desc: 'Muitos detalhes, ilustrações customizadas' },
      { id: 'muito_complexo', name: 'Muito Complexo', multiplier: 1.6, desc: 'Exige pesquisa profunda, 3D ou assets difíceis' },
    ];

    const DEADLINE_LEVELS = [
      { id: 'flexivel', name: 'Flexível', multiplier: 0.95, desc: 'Sem pressa (15+ dias)' },
      { id: 'padrao', name: 'Padrão', multiplier: 1.0, desc: 'Prazo normal (7-14 dias)' },
      { id: 'urgente', name: 'Urgente', multiplier: 1.3, desc: 'Prioridade (3-6 dias)' },
      { id: 'rush', name: 'Para Ontem (Rush)', multiplier: 1.6, desc: 'Menos de 48h (Fura-fila)' },
    ];

    const PAYMENT_METHODS = [
      { id: 'pix_avista', name: 'PIX / À Vista', fee: 0, icon: '⚡' },
      { id: 'pix_50_50', name: 'PIX 50% + 50%', fee: 0, icon: '🤝' },
      { id: 'cartao_1x', name: 'Cartão 1x', fee: 0.04, icon: '💳' },
      { id: 'cartao_parcelado', name: 'Cartão Parcelado', fee: 0.06, icon: '💳' },
      { id: 'boleto', name: 'Boleto', fee: 0, icon: '🧾' },
      { id: 'permuta', name: 'Permuta / Escambo', fee: 0, icon: '🔄' },
    ];

    const CATEGORY_LABELS = [
      { id: 'all', name: 'Todos' },
      { id: 'design', name: 'Design' },
      { id: 'social', name: 'Social' },
      { id: 'mensal', name: 'Pacotes' },
      { id: 'print', name: 'Estampas' },
      { id: 'impressao', name: 'Impressão' },
      { id: 'manutencao', name: 'Manutenção' },
    ];

    const formatCurrency = (value) => {
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL',
      }).format(value);
    };

    function PricingApp() {
      const PIX_KEY = "47c4bc69-8c00-4e7a-8e29-ecc639c33186";
      const PIX_NAME = "Paulo Vinicios Oliveira da Silva";

      const loadState = (key, fallback) => {
        try { const v = localStorage.getItem('viccs_' + key); return v !== null ? JSON.parse(v) : fallback; }
        catch { return fallback; }
      };

      const [selectedServiceId, setSelectedServiceId] = useState(() => loadState('serviceId', BASE_SERVICES[0].id));
      const [complexity, setComplexity] = useState(() => loadState('complexity', 'normal'));
      const [deadline, setDeadline] = useState(() => loadState('deadline', 'padrao'));
      const [extraRevisions, setExtraRevisions] = useState(() => loadState('revisions', 0));
      const [estimatedHours, setEstimatedHours] = useState(() => loadState('hours', 10));
      const [paymentMethod, setPaymentMethod] = useState(() => loadState('payment', 'pix_avista'));
      const [installments, setInstallments] = useState(() => loadState('installments', 1));
      const [activeCategory, setActiveCategory] = useState('all');
      const [dimensionM2, setDimensionM2] = useState(() => loadState('dimension', 1));
      const [customWidth, setCustomWidth] = useState(() => loadState('customWidth', ''));
      const [customHeight, setCustomHeight] = useState(() => loadState('customHeight', ''));
      const [measurementUnit, setMeasurementUnit] = useState(() => loadState('unit', 'm'));
      const [observacoes, setObservacoes] = useState(() => loadState('obs', ''));
      const [isCopied, setIsCopied] = useState(false);
      const [isExporting, setIsExporting] = useState(false);

      const REVISION_COST = 50;

      // Persistência localStorage
      useEffect(() => {
        const data = { serviceId: selectedServiceId, complexity, deadline, revisions: extraRevisions, hours: estimatedHours, payment: paymentMethod, installments, dimension: dimensionM2, customWidth, customHeight, obs: observacoes, unit: measurementUnit };
        Object.entries(data).forEach(([k, v]) => { try { localStorage.setItem('viccs_' + k, JSON.stringify(v)); } catch { } });
      }, [selectedServiceId, complexity, deadline, extraRevisions, estimatedHours, paymentMethod, installments, dimensionM2, customWidth, customHeight, observacoes, measurementUnit]);

      const selectedService = useMemo(() =>
        BASE_SERVICES.find(s => s.id === selectedServiceId) || BASE_SERVICES[0]
        , [selectedServiceId]);

      const filteredServices = useMemo(() =>
        activeCategory === 'all' ? BASE_SERVICES : BASE_SERVICES.filter(s => s.category === activeCategory)
        , [activeCategory]);

      const activeComplexity = useMemo(() =>
        COMPLEXITY_LEVELS.find(c => c.id === complexity) || COMPLEXITY_LEVELS[1]
        , [complexity]);

      const activeDeadline = useMemo(() =>
        DEADLINE_LEVELS.find(d => d.id === deadline) || DEADLINE_LEVELS[1]
        , [deadline]);

      const activePayment = useMemo(() =>
        PAYMENT_METHODS.find(p => p.id === paymentMethod) || PAYMENT_METHODS[0]
        , [paymentMethod]);

      const isAreaBased = selectedService.category === 'impressao';

      const effectiveArea = useMemo(() => {
        if (customWidth && customHeight) {
          const w = parseFloat(customWidth.toString().replace(',', '.'));
          const h = parseFloat(customHeight.toString().replace(',', '.'));
          if (!isNaN(w) && !isNaN(h) && w > 0 && h > 0) {
            let widthInMeters = w;
            let heightInMeters = h;
            if (measurementUnit === 'cm') {
              widthInMeters = w / 100;
              heightInMeters = h / 100;
            } else if (measurementUnit === 'mm') {
              widthInMeters = w / 1000;
              heightInMeters = h / 1000;
            }
            return widthInMeters * heightInMeters;
          }
        }
        return dimensionM2;
      }, [dimensionM2, customWidth, customHeight, measurementUnit]);

      const calculationDetails = useMemo(() => {
        let base = isAreaBased ? selectedService.basePrice * effectiveArea : selectedService.basePrice;
        let complexityAdd = (base * activeComplexity.multiplier) - base;
        let deadlineAdd = (base * activeDeadline.multiplier) - base;
        let revisionsAdd = extraRevisions * REVISION_COST;
        let subtotal = base + complexityAdd + deadlineAdd + revisionsAdd;
        let paymentFee = subtotal * activePayment.fee;
        let grandTotal = subtotal + paymentFee;
        let installmentValue = installments > 1 ? grandTotal / installments : grandTotal;
        let hourlyRate = estimatedHours > 0 ? grandTotal / estimatedHours : 0;

        return { base, complexityAdd, deadlineAdd, revisionsAdd, subtotal, paymentFee, grandTotal, installmentValue, hourlyRate };
      }, [selectedService, activeComplexity, activeDeadline, extraRevisions, estimatedHours, activePayment, installments, effectiveArea, isAreaBased]);

      const dimensionDisplay = useMemo(() => {
        if (customWidth && customHeight) {
          return `${customWidth}${measurementUnit} x ${customHeight}${measurementUnit} (Área: ${effectiveArea.toFixed(2)} m²)`;
        }
        return `${dimensionM2} m²`;
      }, [dimensionM2, customWidth, customHeight, measurementUnit, effectiveArea]);

      const handleCopyProposal = async () => {
        const dimText = isAreaBased ? `\nDimensão: ${dimensionDisplay}` : '';
        const obsText = observacoes.trim() ? `\nObservações: ${observacoes.trim()}` : '';
        const parcText = installments > 1 ? ` — ${installments}x de ${formatCurrency(calculationDetails.installmentValue)}` : '';
        const pixText = (activePayment.id.includes('pix')) ? `\n\nPagamento via PIX:\nChave: ${PIX_KEY}\nTitular: ${PIX_NAME}` : '';
        const text = `Olá! Segue o orçamento para o projeto:

Serviço: ${selectedService.name} ${selectedService.desc ? `(${selectedService.desc})` : ''}${dimText}
Complexidade: ${activeComplexity.name}
Prazo: ${activeDeadline.name}
Revisões Extras: ${extraRevisions}
Forma de Pagamento: ${activePayment.name}${parcText}${pixText}${obsText}

Investimento Total: ${formatCurrency(calculationDetails.grandTotal)}

*Valores sujeitos a alteração caso o escopo mude.*
Qualquer dúvida, estou à disposição! 
- Viccs Design (viccsdesign.vercel.app)`;

        try {
          await navigator.clipboard.writeText(text);
          setIsCopied(true);
          setTimeout(() => setIsCopied(false), 2000);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); setIsCopied(true); setTimeout(() => setIsCopied(false), 2000); } catch (e) { console.error('Falha ao copiar', e); }
          document.body.removeChild(ta);
        }
      };

      const handleReset = () => {
        if(confirm('Tem certeza que deseja limpar todos os campos?')) {
            localStorage.clear();
            setSelectedServiceId(BASE_SERVICES[0].id);
            setComplexity('normal');
            setDeadline('padrao');
            setExtraRevisions(0);
            setEstimatedHours(10);
            setPaymentMethod('pix_avista');
            setInstallments(1);
            setActiveCategory('all');
            setDimensionM2(1);
            setCustomWidth('');
            setCustomHeight('');
            setMeasurementUnit('m');
            setObservacoes('');
        }
      };

      const handleExportPDF = async () => {
        const element = document.getElementById('pdf-proposal');
        if (!element) return;
        
        setIsExporting(true);
        element.style.display = 'block';
        
        try {
          const canvas = await html2canvas(element, { scale: 2 });
          const imgData = canvas.toDataURL('image/png');
          
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          
          pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
          pdf.save(`Proposta_${selectedService.name.replace(/\s+/g, '_')}.pdf`);
        } catch (err) {
          console.error("Erro ao gerar PDF:", err);
          alert("Ocorreu um erro ao gerar o PDF.");
        } finally {
          element.style.display = 'none';
          setIsExporting(false);
        }
      };

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-6xl mx-auto space-y-8">

            <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-slate-800">
              <div>
              <div 
                onContextMenu={(e) => e.preventDefault()} 
                className="flex items-center select-none"
              >
                <img 
                  src=".agent/media/svg/viccs_logo_white.svg" 
                  alt="VICCS Logo" 
                  className="h-8 object-contain pointer-events-none" 
                  draggable={false} 
                />
              </div>
                <p className="text-slate-400 mt-1 flex items-center gap-2">
                  Calculadora de Projetos & Precificação Justa
                  <a href="https://viccsdesign.vercel.app/" target="_blank" rel="noreferrer" className="inline-flex items-center text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded transition-colors text-purple-300">
                    Acessar Portfólio ↗
                  </a>
                </p>
              </div>
              <div className="flex gap-3 w-full md:w-auto">
                <button onClick={handleReset} className="flex-1 md:flex-none px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-lg transition-colors flex items-center justify-center gap-2 border border-slate-700">
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                  Limpar
                </button>
                <button onClick={handleExportPDF} disabled={isExporting} className="flex-1 md:flex-none px-4 py-2 bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 border border-blue-500/30 text-sm font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
                  {isExporting ? 'Gerando...' : (
                    <>
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                      Exportar PDF
                    </>
                  )}
                </button>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className="lg:col-span-8 space-y-8">

                <section className="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl">
                  <h2 className="text-xl font-semibold mb-4 text-white flex items-center gap-2">
                    <svg className="w-5 h-5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                    1. Serviço Base
                  </h2>
                  <div className="flex flex-wrap gap-2 mb-4">
                    {CATEGORY_LABELS.map((cat) => (
                      <button
                        key={cat.id}
                        onClick={() => setActiveCategory(cat.id)}
                        className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${activeCategory === cat.id
                          ? 'bg-purple-600 text-white shadow-md'
                          : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200'
                          }`}
                      >
                        {cat.name}
                      </button>
                    ))}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {filteredServices.map((service) => (
                      <button
                        key={service.id}
                        onClick={() => setSelectedServiceId(service.id)}
                        className={`text-left p-4 rounded-xl transition-all border ${selectedServiceId === service.id
                          ? 'bg-purple-900/20 border-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.15)]'
                          : 'bg-slate-800/50 border-slate-700 hover:border-slate-500 hover:bg-slate-800'
                          }`}
                      >
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-2xl">{service.icon}</span>
                          <span className="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-slate-700/60 text-slate-400">{service.category}</span>
                        </div>
                        <div className="font-medium text-slate-100">{service.name}</div>
                        {service.desc && <div className="text-xs text-slate-400 mt-1">{service.desc}</div>}
                        <div className="mt-3 font-semibold text-purple-400">
                          {formatCurrency(service.basePrice)}{service.category === 'impressao' ? '/m²' : ''}
                        </div>
                      </button>
                    ))}
                  </div>
                  {isAreaBased && (
                    <div className="mt-4 p-4 bg-slate-800/50 rounded-xl border border-cyan-500/30 space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-cyan-300 mb-2 flex justify-between">
                          <span>📐 Dimensão por Slider (m²)</span>
                          <span className="text-cyan-400 font-semibold">{dimensionM2} m²</span>
                        </label>
                        <input
                          type="range" min="1" max="50" step="0.5" value={dimensionM2}
                          onChange={(e) => {
                            setDimensionM2(parseFloat(e.target.value));
                            setCustomWidth('');
                            setCustomHeight('');
                          }}
                          className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500"
                        />
                      </div>
                      
                      <div className="pt-3 border-t border-slate-700">
                        <label className="block text-sm font-medium text-cyan-300 mb-2 flex justify-between items-center">
                          <span>Ou insira a medida exata:</span>
                          <select 
                            value={measurementUnit}
                            onChange={(e) => setMeasurementUnit(e.target.value)}
                            className="bg-slate-800 border border-slate-600 rounded-lg p-1 text-xs text-slate-200 outline-none cursor-pointer"
                          >
                            <option value="m">Metros (m)</option>
                            <option value="cm">Centímetros (cm)</option>
                            <option value="mm">Milímetros (mm)</option>
                          </select>
                        </label>
                        <div className="flex gap-4">
                          <div className="flex-1">
                            <label className="text-xs text-slate-400">Largura ({measurementUnit})</label>
                            <input 
                              type="number" step="0.01" min="0" placeholder={`Ex: ${measurementUnit === 'm' ? '1.5' : measurementUnit === 'cm' ? '150' : '1500'}`}
                              value={customWidth}
                              onChange={(e) => setCustomWidth(e.target.value)}
                              className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-slate-200 mt-1 focus:border-cyan-500 outline-none"
                            />
                          </div>
                          <div className="flex items-center pt-5 text-slate-500">x</div>
                          <div className="flex-1">
                            <label className="text-xs text-slate-400">Altura ({measurementUnit})</label>
                            <input 
                              type="number" step="0.01" min="0" placeholder={`Ex: ${measurementUnit === 'm' ? '2.0' : measurementUnit === 'cm' ? '200' : '2000'}`}
                              value={customHeight}
                              onChange={(e) => setCustomHeight(e.target.value)}
                              className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-slate-200 mt-1 focus:border-cyan-500 outline-none"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="text-xs text-slate-400 mt-2 bg-slate-900/50 p-2 rounded-lg">
                        Base: {formatCurrency(selectedService.basePrice)}/m² × <strong className="text-cyan-400">{effectiveArea.toFixed(2)} m²</strong> = <strong className="text-white">{formatCurrency(calculationDetails.base)}</strong>
                      </div>
                    </div>
                  )}
                </section>


                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <section className="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl">
                    <h2 className="text-xl font-semibold mb-4 text-white">2. Nível de Complexidade</h2>
                    <div className="space-y-3">
                      {COMPLEXITY_LEVELS.map((lvl) => (
                        <label key={lvl.id} className={`flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition-colors ${complexity === lvl.id ? 'bg-blue-900/20 border-blue-500' : 'bg-slate-800/30 border-slate-700 hover:bg-slate-800'}`}>
                          <input
                            type="radio"
                            name="complexity"
                            value={lvl.id}
                            checked={complexity === lvl.id}
                            onChange={(e) => setComplexity(e.target.value)}
                            className="mt-1 w-4 h-4 text-blue-500 bg-slate-900 border-slate-600 focus:ring-blue-500"
                          />
                          <div>
                            <div className="font-medium text-slate-200">{lvl.name}</div>
                            <div className="text-xs text-slate-400">{lvl.desc}</div>
                          </div>
                        </label>
                      ))}
                    </div>
                  </section>

                  <section className="space-y-8">
                    <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl">
                      <h2 className="text-xl font-semibold mb-4 text-white">3. Prazo / Urgência</h2>
                      <div className="space-y-3">
                        {DEADLINE_LEVELS.map((lvl) => (
                          <label key={lvl.id} className={`flex items-center justify-between p-3 rounded-lg border cursor-pointer transition-colors ${deadline === lvl.id ? 'bg-orange-900/20 border-orange-500' : 'bg-slate-800/30 border-slate-700 hover:bg-slate-800'}`}>
                            <div className="flex items-center gap-3">
                              <input
                                type="radio"
                                name="deadline"
                                value={lvl.id}
                                checked={deadline === lvl.id}
                                onChange={(e) => setDeadline(e.target.value)}
                                className="w-4 h-4 text-orange-500 bg-slate-900 border-slate-600 focus:ring-orange-500"
                              />
                              <div>
                                <div className="font-medium text-slate-200">{lvl.name}</div>
                                <div className="text-xs text-slate-400">{lvl.desc}</div>
                              </div>
                            </div>
                          </label>
                        ))}
                      </div>
                    </div>

                    <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl">
                      <h2 className="text-xl font-semibold mb-4 text-white">4. Ajustes Finos</h2>
                      <div className="mb-6">
                        <label className="block text-sm font-medium text-slate-300 mb-2">
                          Revisões Extras (Além das inclusas)
                        </label>
                        <div className="flex items-center gap-4">
                          <button onClick={() => setExtraRevisions(Math.max(0, extraRevisions - 1))} className="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xl font-bold">-</button>
                          <span className="text-xl font-semibold w-8 text-center">{extraRevisions}</span>
                          <button onClick={() => setExtraRevisions(extraRevisions + 1)} className="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-xl font-bold">+</button>
                          <span className="text-sm text-slate-400 ml-2">(+ {formatCurrency(REVISION_COST)} cada)</span>
                        </div>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2 flex justify-between">
                          <span>Estimativa de Horas (p/ métrica)</span>
                          <span className="text-purple-400 font-semibold">{estimatedHours}h</span>
                        </label>
                        <input
                          type="range"
                          min="1"
                          max="80"
                          value={estimatedHours}
                          onChange={(e) => setEstimatedHours(parseInt(e.target.value))}
                          className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500"
                        />
                      </div>
                    </div>
                  </section>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  <section className="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl">
                    <h2 className="text-xl font-semibold mb-4 text-white">5. Forma de Pagamento</h2>
                    <div className="space-y-3">
                      {PAYMENT_METHODS.map((pm) => (
                        <label key={pm.id} className={`flex items-center justify-between p-3 rounded-lg border cursor-pointer transition-colors ${paymentMethod === pm.id ? 'bg-emerald-900/20 border-emerald-500' : 'bg-slate-800/30 border-slate-700 hover:bg-slate-800'}`}>
                          <div className="flex items-center gap-3">
                            <input
                              type="radio" name="payment" value={pm.id}
                              checked={paymentMethod === pm.id}
                              onChange={(e) => { setPaymentMethod(e.target.value); if (e.target.value !== 'cartao_parcelado') setInstallments(1); }}
                              className="w-4 h-4 text-emerald-500 bg-slate-900 border-slate-600 focus:ring-emerald-500"
                            />
                            <div>
                              <div className="font-medium text-slate-200">{pm.icon} {pm.name}</div>
                              {pm.fee > 0 && <div className="text-xs text-red-400">+{(pm.fee * 100).toFixed(0)}% taxa</div>}
                            </div>
                          </div>
                        </label>
                      ))}
                    </div>
                    {paymentMethod === 'cartao_parcelado' && (
                      <div className="mt-4 p-3 bg-slate-800/50 rounded-xl border border-emerald-500/30">
                        <label className="block text-sm font-medium text-emerald-300 mb-2 flex justify-between">
                          <span>Parcelas</span>
                          <span className="text-emerald-400 font-semibold">{installments}x de {formatCurrency(calculationDetails.installmentValue)}</span>
                        </label>
                        <input type="range" min="2" max="12" value={installments}
                          onChange={(e) => setInstallments(parseInt(e.target.value))}
                          className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500"
                        />
                      </div>
                    )}
                    {paymentMethod === 'permuta' && (
                      <div className="mt-4">
                        <textarea placeholder="Descreva a permuta..." value={observacoes}
                          onChange={(e) => setObservacoes(e.target.value)}
                          className="w-full h-20 bg-slate-800 border border-slate-600 rounded-lg p-3 text-sm text-slate-200 placeholder-slate-500 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none resize-none"
                        />
                      </div>
                    )}
                  </section>

                  <section className="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl">
                    <h2 className="text-xl font-semibold mb-4 text-white">6. Observações</h2>
                    <textarea
                      placeholder="Anotações internas ou detalhes para o cliente..."
                      value={observacoes}
                      onChange={(e) => setObservacoes(e.target.value)}
                      className="w-full h-32 bg-slate-800 border border-slate-600 rounded-lg p-3 text-sm text-slate-200 placeholder-slate-500 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none resize-none"
                    />
                    <p className="text-xs text-slate-500 mt-2">Aparece na proposta copiada, se preenchido.</p>
                  </section>
                </div>

              </div>


              <div className="lg:col-span-4">
                <div className="sticky top-8 bg-gradient-to-b from-slate-900 to-slate-950 rounded-3xl p-6 border border-slate-800 shadow-2xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 bg-purple-500/20 blur-3xl rounded-full"></div>
                  <div className="absolute bottom-0 left-0 -ml-16 -mb-16 w-32 h-32 bg-blue-500/20 blur-3xl rounded-full"></div>

                  <h2 className="text-lg font-medium text-slate-300 mb-6 uppercase tracking-wider text-center">Resumo do Orçamento</h2>

                  <div className="space-y-4 mb-8 relative z-10">
                    <div className="flex justify-between items-end border-b border-slate-800 pb-2">
                      <div>
                        <div className="text-sm text-slate-400">Serviço Base</div>
                        <div className="font-medium text-slate-200 truncate max-w-[180px]" title={selectedService.name}>
                          {selectedService.name}
                        </div>
                      </div>
                      <div className="font-semibold text-white">{formatCurrency(calculationDetails.base)}</div>
                    </div>

                    {calculationDetails.complexityAdd !== 0 && (
                      <div className="flex justify-between items-center text-sm">
                        <div className="text-slate-400">Complexidade ({activeComplexity.name})</div>
                        <div className={calculationDetails.complexityAdd > 0 ? "text-red-400" : "text-green-400"}>
                          {calculationDetails.complexityAdd > 0 ? '+' : ''}{formatCurrency(calculationDetails.complexityAdd)}
                        </div>
                      </div>
                    )}

                    {calculationDetails.deadlineAdd !== 0 && (
                      <div className="flex justify-between items-center text-sm">
                        <div className="text-slate-400">Prazo ({activeDeadline.name})</div>
                        <div className={calculationDetails.deadlineAdd > 0 ? "text-red-400" : "text-green-400"}>
                          {calculationDetails.deadlineAdd > 0 ? '+' : ''}{formatCurrency(calculationDetails.deadlineAdd)}
                        </div>
                      </div>
                    )}

                    {extraRevisions > 0 && (
                      <div className="flex justify-between items-center text-sm">
                        <div className="text-slate-400">{extraRevisions}x Revisões Extras</div>
                        <div className="text-slate-300">
                          +{formatCurrency(calculationDetails.revisionsAdd)}
                        </div>
                      </div>
                    )}

                    {calculationDetails.paymentFee > 0 && (
                      <div className="flex justify-between items-center text-sm">
                        <div className="text-slate-400">Taxa ({activePayment.name})</div>
                        <div className="text-red-400">+{formatCurrency(calculationDetails.paymentFee)}</div>
                      </div>
                    )}

                    {isAreaBased && (
                      <div className="flex justify-between items-center text-sm">
                        <div className="text-cyan-400">📐 {dimensionDisplay}</div>
                        <div className="text-slate-400 text-xs">incluso no base</div>
                      </div>
                    )}
                  </div>

                  <div className="bg-slate-950/50 rounded-2xl p-6 border border-purple-500/30 text-center relative z-10 shadow-inner">
                    <div className="text-sm text-purple-300 mb-1 font-medium">Preço Final Sugerido</div>
                    <div className="text-4xl md:text-5xl font-bold text-white tracking-tight">
                      {formatCurrency(calculationDetails.grandTotal)}
                    </div>

                    {installments > 1 && (
                      <div className="mt-2 text-sm text-emerald-400 font-medium">
                        {installments}x de {formatCurrency(calculationDetails.installmentValue)}
                      </div>
                    )}

                    <div className="mt-4 pt-4 border-t border-slate-800/50 flex justify-center items-center gap-2">
                      <div className="text-xs text-slate-400">Métrica:</div>
                      <div className={`text-sm font-semibold px-2 py-1 rounded ${calculationDetails.hourlyRate > 40 ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'}`}>
                        {formatCurrency(calculationDetails.hourlyRate)} / hora
                      </div>
                    </div>

                    <div className="mt-2 text-xs text-slate-500">{activePayment.icon} {activePayment.name}</div>
                  </div>

                  <button
                    onClick={handleCopyProposal}
                    className={`mt-6 w-full py-4 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all relative z-10 ${isCopied
                      ? 'bg-green-600 hover:bg-green-500 text-white shadow-[0_0_20px_rgba(22,163,74,0.4)]'
                      : 'bg-purple-600 hover:bg-purple-500 text-white shadow-[0_0_20px_rgba(147,51,234,0.3)] hover:shadow-[0_0_25px_rgba(147,51,234,0.5)] transform hover:-translate-y-1'
                      }`}
                  >
                    {isCopied ? (
                      <>
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                        Proposta Copiada!
                      </>
                    ) : (
                      <>
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>
                        Copiar Resumo p/ Cliente
                      </>
                    )}
                  </button>
                  <p className="text-xs text-slate-500 text-center mt-4 relative z-10">
                    Ferramenta interna. Ajuste se necessário.
                  </p>
                </div>
              </div>

            </div>
          </div>

          {/* Hidden PDF Template */}
          <div id="pdf-proposal" className="bg-white text-slate-800 p-10 w-[800px] hidden absolute top-0 left-0 z-[-1]" style={{ width: '800px', margin: '0 auto', background: 'white' }}>
            {/* Cabecalho PDF */}

                  <div className="flex justify-between"><span className="text-slate-600">Valor Base</span> <span className="text-slate-900 font-medium">{formatCurrency(calculationDetails.base)}</span></div>
                  {calculationDetails.complexityAdd !== 0 && <div className="flex justify-between"><span className="text-slate-600">Adicional de Complexidade</span> <span className="text-slate-900 font-medium">{calculationDetails.complexityAdd > 0 ? '+' : ''}{formatCurrency(calculationDetails.complexityAdd)}</span></div>}
                  {calculationDetails.deadlineAdd !== 0 && <div className="flex justify-between"><span className="text-slate-600">Adicional de Prazo</span> <span className="text-slate-900 font-medium">{calculationDetails.deadlineAdd > 0 ? '+' : ''}{formatCurrency(calculationDetails.deadlineAdd)}</span></div>}
                  {extraRevisions > 0 && <div className="flex justify-between"><span className="text-slate-600">Revisões Extras ({extraRevisions}x)</span> <span className="text-slate-900 font-medium">+{formatCurrency(calculationDetails.revisionsAdd)}</span></div>}
                  {calculationDetails.paymentFee > 0 && <div className="flex justify-between"><span className="text-slate-600">Taxa de Pagamento</span> <span className="text-slate-900 font-medium">+{formatCurrency(calculationDetails.paymentFee)}</span></div>}
                  
                  <div className="flex justify-between items-center pt-4 mt-2 border-t border-slate-200">
                    <span className="text-base font-semibold text-slate-900">Investimento Total</span> 
                    <span className="text-2xl font-bold text-purple-600">{formatCurrency(calculationDetails.grandTotal)}</span>
                  </div>
                </div>
              </div>

              <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                <h2 className="text-lg font-semibold text-emerald-600 mb-4 border-b border-slate-200 pb-2">Condições de Pagamento</h2>
                <div className="text-sm space-y-2">
                  <div><span className="text-slate-500 block">Forma Escolhida</span> <span className="font-medium text-slate-900">{activePayment.name} {installments > 1 ? `(${installments}x de ${formatCurrency(calculationDetails.installmentValue)})` : ''}</span></div>
                  
                  {activePayment.id.includes('pix') && (
                    <div className="mt-4 p-4 bg-emerald-50 rounded-lg border border-emerald-200">
                      <div className="text-emerald-700 font-semibold mb-1">Dados para PIX</div>
                      <div className="text-slate-700">Chave: <span className="font-mono bg-white px-2 py-1 rounded border border-emerald-100">{PIX_KEY}</span></div>
                      <div className="text-slate-700 mt-1">Titular: {PIX_NAME}</div>
                    </div>
                  )}
                </div>
              </div>

              {observacoes.trim() && (
                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                  <h2 className="text-lg font-semibold text-slate-700 mb-2 border-b border-slate-200 pb-2">Observações</h2>
                  <p className="text-sm text-slate-600 whitespace-pre-wrap">{observacoes}</p>
                </div>
              )}
            </div>
            
            <div className="mt-12 text-center text-xs text-slate-500 border-t border-slate-200 pt-4">
              Proposta gerada automaticamente. Valores sujeitos a alteração caso o escopo seja modificado.
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PricingApp />);
  </script>
</body>

</html>
